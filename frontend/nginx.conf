server {
    listen 80;
    root /usr/share/nginx/html;

    # API đi qua gateway (tên service trong mạng Docker của compose).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File đã có hash trong tên: cache lâu. index.html thì không, để bản mới đến ngay.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: mọi đường dẫn khác (/orders/abc...) trả index.html, React Router lo phần còn lại.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
