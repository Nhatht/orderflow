# CI/CD của OrderFlow.
#
#   backend   mvn verify: unit + integration test (Testcontainers dựng Kafka/Postgres/Redis THẬT)
#   frontend  typecheck + build React
#   e2e       docker compose up cả hệ thống như người clone repo, rồi đặt đơn thật (scripts/smoke-test.sh)
#   publish   (CD) chỉ khi push lên main và cả ba job trên xanh: đẩy 6 image lên GitHub Container Registry
#
# Không có bước deploy lên server: dự án chạy bằng docker compose trên máy người xem.
# "Delivery" ở đây = image đã build sẵn, `docker compose pull` là chạy được, không cần Maven/Node.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:   # nút "Run workflow" trên tab Actions: chạy tay bất cứ lúc nào

# Push mới lên cùng nhánh thì huỷ lần chạy cũ: không tốn phút CI cho commit đã lỗi thời.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compile + unit test (surefire) + integration test (failsafe)
      - name: Build and test
        run: mvn -B -ntp verify
      # Test đỏ thì tải báo cáo về xem, không phải đoán từ log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # build = tsc -b (typecheck) + vite build
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole system
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Place real orders through the gateway
        run: bash scripts/smoke-test.sh
      - name: Same, through the frontend's nginx
        run: BASE_URL=http://localhost:3000 bash scripts/smoke-test.sh
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # đẩy image lên ghcr.io bằng GITHUB_TOKEN, không cần secret riêng
    strategy:
      matrix:
        include:
          - { image: order-service, context: backend, service: order-service }
          - { image: inventory-service, context: backend, service: inventory-service }
          - { image: payment-service, context: backend, service: payment-service }
          - { image: notification-service, context: backend, service: notification-service }
          - { image: api-gateway, context: backend, service: api-gateway }
          - { image: frontend, context: frontend, service: '' }
    steps:
      - uses: actions/checkout@v4
      # Tên image trên GHCR phải viết thường; tên tài khoản GitHub thì không.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orderflow/${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Gắn image với repo: trang package trên GitHub trỏ về mã nguồn.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
