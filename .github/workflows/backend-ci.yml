# Build + toàn bộ test (unit + integration) của backend trên mỗi push / pull request.
#
# Integration test dùng Testcontainers: runner ubuntu-latest của GitHub có sẵn
# Docker, nên Kafka / PostgreSQL / Redis / MailHog THẬT được dựng ngay trong CI —
# cùng bộ test chạy trên máy dev, không có bản "CI nhẹ" nào khác.
#
# Profile Maven "windows-docker" (ép Docker API 1.44) chỉ bật trên Windows,
# nên không ảnh hưởng runner Linux.
name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

# Push mới lên cùng nhánh thì huỷ lần chạy cũ — không tốn phút CI cho commit đã lỗi thời.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile + unit test (surefire) + integration test (failsafe)
      - name: Build and test
        run: mvn -B -ntp verify

      # Test đỏ thì tải báo cáo về xem, không phải đoán từ log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7
