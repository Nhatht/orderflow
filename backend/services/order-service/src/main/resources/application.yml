server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    # Cổng 5433 = postgres-order trong docker-compose.
    # Mỗi service một database RIÊNG — xem ghi chú trong docker-compose.yml.
    url: jdbc:postgresql://localhost:5433/order_db
    username: orderflow
    password: orderflow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # KHÔNG BAO GIỜ dùng 'update' hay 'create' — schema do Flyway quản lý.
      # 'validate' để Hibernate đối chiếu entity với bảng thật và báo lỗi ngay
      # lúc khởi động nếu lệch, thay vì để lỗi nổ lúc chạy.
      ddl-auto: validate
    open-in-view: false   # tránh giữ session mở suốt request (nguồn gốc lazy loading ngoài ý muốn)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    # DÙNG 29092, KHÔNG PHẢI 9092.
    # Service chạy từ IntelliJ nằm NGOÀI mạng Docker, phải đi qua listener
    # EXTERNAL. Xem giải thích dài trong infra/docker/docker-compose.yml.
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # CHUỖI, không phải JsonSerializer: từ tuần 5 chỉ có OutboxPoller gửi
      # Kafka, và thứ nó gửi là JSON đã serialize sẵn lúc ghi outbox. Đưa chuỗi
      # đó qua JsonSerializer sẽ bị bọc thêm một lớp ngoặc kép.
      # Hệ quả phụ: không còn header __TypeId__ — tên class Java không rò rỉ
      # lên dây, hợp đồng chỉ là JSON + tên topic.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all           # chờ mọi replica xác nhận — không chấp nhận mất message
      retries: 3
      properties:
        enable.idempotence: true   # producer không gửi trùng khi retry
        # ---------------------------------------------------------------------
        # THẤT BẠI NHANH. Mặc định producer tự giữ message trong bộ nhớ và thử
        # lại tới 2 PHÚT (delivery.timeout.ms), chặn tới 60 giây khi chưa có
        # metadata (max.block.ms). Trước tuần 5, bộ đệm đó là thứ DUY NHẤT giữ
        # event lúc Kafka sập — và nó nằm trong RAM, app chết là mất.
        #
        # Giờ bảng outbox mới là bộ đệm bền vững. Producer giữ message lâu chỉ
        # làm poller treo, giữ transaction và khoá dòng. Thà lỗi sau vài giây,
        # rollback, để vòng poll sau thử lại từ database.
        # (delivery.timeout.ms phải >= linger.ms + request.timeout.ms)
        # ---------------------------------------------------------------------
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Đọc value thành CHUỖI, để StringJsonMessageConverter (KafkaConfig) chuyển
      # sang đúng kiểu generic của tham số listener. Xem KafkaConfig của
      # inventory-service để biết vì sao không dùng JsonDeserializer.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jackson:
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 dễ đọc hơn epoch millis
    default-property-inclusion: non_null

# =============================================================================
# Transactional Outbox — xem adapter/out/messaging/OutboxPoller.java
# =============================================================================
orderflow:
  outbox:
    poll-interval: PT0.5S   # độ trễ tối đa từ lúc commit tới lúc lên Kafka
    batch-size: 100         # số dòng mỗi lô; còn tồn thì xả tiếp ngay
    # Chờ Kafka xác nhận cả lô tối đa bao lâu. Phải LỚN HƠN delivery.timeout.ms
    # để mọi lần gửi kịp kết thúc (thành công hay thất bại) trước khi bỏ cuộc.
    send-timeout: PT15S
    retention: P7D          # giữ dòng đã gửi 7 ngày để tra cứu, rồi xoá
    cleanup-cron: "0 0 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0   # dev lấy mẫu 100%; production nên hạ xuống

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.orderflow: DEBUG
    org.hibernate.SQL: INFO
