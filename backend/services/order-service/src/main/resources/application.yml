server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    # Cổng 5433 = postgres-order trong docker-compose.
    # Mỗi service một database RIÊNG — xem ghi chú trong docker-compose.yml.
    url: jdbc:postgresql://localhost:5433/order_db
    username: orderflow
    password: orderflow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # KHÔNG BAO GIỜ dùng 'update' hay 'create' — schema do Flyway quản lý.
      # 'validate' để Hibernate đối chiếu entity với bảng thật và báo lỗi ngay
      # lúc khởi động nếu lệch, thay vì để lỗi nổ lúc chạy.
      ddl-auto: validate
    open-in-view: false   # tránh giữ session mở suốt request (nguồn gốc lazy loading ngoài ý muốn)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    # DÙNG 29092, KHÔNG PHẢI 9092.
    # Service chạy từ IntelliJ nằm NGOÀI mạng Docker, phải đi qua listener
    # EXTERNAL. Xem giải thích dài trong infra/docker/docker-compose.yml.
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all           # chờ mọi replica xác nhận — không chấp nhận mất message
      retries: 3
      properties:
        enable.idempotence: true   # producer không gửi trùng khi retry
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.orderflow.contracts

  jackson:
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 dễ đọc hơn epoch millis
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0   # dev lấy mẫu 100%; production nên hạ xuống

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.orderflow: DEBUG
    org.hibernate.SQL: INFO
