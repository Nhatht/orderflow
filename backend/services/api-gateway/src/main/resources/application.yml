server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # Áp cho MỌI route. /auth/login không phải route (là controller của chính
      # gateway) nên không bị giới hạn ở đây.
      default-filters:
        - name: RequestRateLimiter
          args:
            # Token bucket — xem config/RateLimitConfig.java.
            # Trung bình 10 request/giây mỗi người, cho dồn tới 20 một lúc.
            redis-rate-limiter.replenishRate: ${orderflow.gateway.rate-limit.replenish-rate:10}
            redis-rate-limiter.burstCapacity: ${orderflow.gateway.rate-limit.burst-capacity:20}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
        # Gateway đặt X-Correlation-Id trên response (IdentityPropagationFilter),
        # và order-service cũng trả lại header đó → client nhận HAI bản. Giữ một.
        # (Phát hiện khi chạy thật toàn hệ thống tuần 8.)
        - DedupeResponseHeader=X-Correlation-Id, RETAIN_FIRST
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
        # CHỈ đọc tồn kho. /api/inventory/reservations/** là lệnh nội bộ của
        # saga (giữ/nhả/chốt hàng) — mở ra ngoài thì một khách có token cũng giữ
        # sạch kho bằng orderId bịa, hoặc nhả phiếu của người khác.
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/stock/**
            - Method=GET
        # KHÔNG có route tới payment-service. API của nó chỉ để gỡ lỗi, và nó
        # không lưu customerId nên không kiểm được ai là chủ khoản thanh toán —
        # mở ra ngoài thì ai cũng xem được tiền của đơn người khác (IDOR).
        # Khách xem trạng thái thanh toán qua timeline saga của order-service.

orderflow:
  gateway:
    jwt:
      # CHỈ DÙNG CHO DEV. Production: đưa qua biến môi trường JWT_SECRET hoặc
      # secret manager, và tốt hơn nữa là RS256 với auth server riêng.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
      ttl: PT1H
    # Người dùng demo — thay cho auth service thật (ngoài phạm vi dự án).
    demo-users:
      alice:
        password: alice123
        customer-id: c0ffee00-0000-0000-0000-00000000a11c
      bob:
        password: bob123
        customer-id: c0ffee00-0000-0000-0000-000000000b0b

management:
  endpoints:
    web:
      exposure:
        # KHÔNG mở "gateway": endpoint đó cho POST/DELETE route lúc chạy — ai có
        # token cũng thêm được route trỏ vào địa chỉ nội bộ bất kỳ (SSRF).
        include: health,info,metrics

---
# =============================================================================
# Distributed tracing (pattern 7, tuần 8) — Micrometer Tracing → OpenTelemetry
# → OTLP/HTTP → Jaeger (http://localhost:16686). Tài liệu YAML riêng (sau ---)
# để không trùng khoá management/logging ở trên; Spring Boot gộp hai tài liệu.
#
# Test (@SpringBootTest) mặc định TẮT tracing — không có Jaeger vẫn chạy được.
# =============================================================================
management:
  tracing:
    sampling:
      probability: 1.0   # dev lấy mẫu 100%; production hạ xuống (vd. 0.1)
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # Mỗi dòng log mang [service,traceId,spanId,correlationId] — copy traceId
    # từ log dán vào Jaeger là thấy cả đường đi của request.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
