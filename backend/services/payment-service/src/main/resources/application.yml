server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5435/payment_db
    username: orderflow
    password: orderflow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092   # 29092 = listener EXTERNAL, xem docker-compose.yml
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Chuỗi JSON đã serialize sẵn trong outbox — xem order-service.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Thất bại nhanh — outbox là bộ đệm bền vững. Xem order-service.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

orderflow:
  outbox:                   # ý nghĩa từng dòng: xem application.yml của order-service
    poll-interval: PT0.5S
    batch-size: 100
    send-timeout: PT15S
    retention: P7D
    cleanup-cron: "0 0 3 * * *"
  payment:
    gateway:
      # Độ trễ giả lập của cổng thanh toán. Cổng thật mất 30–90 giây vì khách
      # nhập OTP — để 0.2 giây cho dev nhanh, nhưng code phải đúng với cả 90 giây.
      latency: PT0.2S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.orderflow: DEBUG
