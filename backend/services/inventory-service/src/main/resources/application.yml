server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: orderflow
    password: orderflow
    hikari:
      maximum-pool-size: 20    # cao hơn order-service: nhiều luồng chờ khoá cùng lúc
      minimum-idle: 4
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092   # 29092 = listener EXTERNAL, xem docker-compose.yml
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Chuỗi JSON đã serialize sẵn trong outbox — xem giải thích ở order-service.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Thất bại nhanh: outbox mới là bộ đệm bền vững, không phải RAM của
        # producer. Xem giải thích đầy đủ ở order-service.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # Group id = tên service. Mọi instance inventory chung một group, nên mỗi
      # message chỉ được MỘT instance xử lý (Kafka chia partition cho họ).
      # Service khác nghe cùng topic dùng group khác và nhận bản sao riêng.
      group-id: inventory-service
      # Group mới toanh (lần đầu deploy) đọc từ đầu topic, không bỏ sót đơn
      # nào được tạo trước khi inventory chạy lần đầu.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Chỉ đọc chuỗi; việc parse JSON sang đúng kiểu generic do
      # StringJsonMessageConverter làm — xem config/KafkaConfig.java.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 3 luồng consumer = 3 partition của order.created: mỗi luồng một partition.
      # Đặt lớn hơn số partition thì luồng thừa ngồi không.
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# =============================================================================
# Cấu hình riêng của inventory — ba con số này đều có lý do, đừng đổi bừa
# =============================================================================
orderflow:
  outbox:                   # ý nghĩa từng dòng: xem application.yml của order-service
    poll-interval: PT0.5S
    batch-size: 100
    send-timeout: PT15S
    retention: P7D
    cleanup-cron: "0 0 3 * * *"

  inventory:
    # Phiếu giữ hàng sống bao lâu trước khi job dọn dẹp nhả về kho.
    #
    # 3 PHÚT, KHÔNG PHẢI 30 GIÂY. Khách phải mở app ngân hàng và nhập OTP,
    # thực tế mất 30-90 giây. Đặt quá ngắn sẽ huỷ nhầm đơn hợp lệ, rồi
    # PaymentCompleted về muộn -> khách bị trừ tiền mà đơn đã huỷ và hàng
    # đã bán cho người khác. Xem docs/PATTERNS.md, bẫy "late response".
    reservation-ttl: PT3M

    expiry:
      # Job nhả phiếu quá hạn chạy bao lâu một lần (ReservationExpiryJob).
      # Phiếu sống 3 phút, nhả trễ tối đa 30 giây là chấp nhận được.
      interval: PT30S
      batch-size: 100

    lock:
      # Chờ tối đa để lấy khoá. Hết thời gian thì ném lỗi cho client thử lại,
      # KHÔNG chờ vô hạn — chờ vô hạn làm cạn thread pool và sập cả service.
      wait-time: PT5S

      # Giữ khoá tối đa rồi tự nhả. Đây là chống chết cứng: tiến trình bị kill
      # thì khoá vẫn được giải phóng, không treo vĩnh viễn như coordinator 2PC.
      # Phải lớn hơn hẳn thời gian xử lý thật (ở đây chỉ vài chục ms).
      lease-time: PT10S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.orderflow: DEBUG
